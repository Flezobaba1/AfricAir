log_format africair_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"request":"$request","status":$status,'
  '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/africair/current;
    index index.html;

    access_log /var/log/nginx/africair.access.json africair_json;
    error_log  /var/log/nginx/africair.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        try_files /version.json =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

